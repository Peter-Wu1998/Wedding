<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>婚礼答谢</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 资源加载页 -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-heart">💗</div>
            <p class="loading-title">正在准备</p>
            <p class="loading-subtitle">请稍候…</p>
            <div class="loading-bar">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
            </div>
            <p class="loading-percent" id="loadingPercent">0%</p>
        </div>
    </div>

    <div class="container" id="app" hidden>
        <!-- 主内容部分 -->
        <section class="main-content" id="mainContent">
            <!-- 答谢语 -->
            <div class="couple-section thanks-banner">
                <p class="thanks-text">
                    感谢您见证我们的幸福时刻<br>
                    您的祝福，是我们最珍贵的礼物
                </p>
                <p class="thanks-names">伍良俊 &amp; 吴丹</p>
            </div>

            <!-- 衷心感谢 · 宾客名单 -->
            <div class="love-message guest-board">
                <h2 class="section-title">衷心感谢</h2>
                <div class="guest-list" id="guestList">
                    <!-- 接到花瓣后显示宾客姓名 -->
                </div>
            </div>

            <div class="play-space" aria-hidden="true"></div>
        </section>
    </div>

    <!-- 飘落的花瓣效果 -->
    <div class="petals" id="petals" hidden></div>

    <!-- 底部可移动的小人 -->
    <div class="character" id="character" hidden>
        <!-- 跑步动画角色 -->
        <div class="running-character">
            <img id="characterSprite" src="frames/frame_0000.png" alt="角色">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
